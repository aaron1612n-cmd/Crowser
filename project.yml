name: Crowser
options:
  bundleIdPrefix: com.aaron1612n
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Crowser:
    type: application
    platform: iOS
    sources:
      - path: Crowser
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaron1612n.crowser
        PRODUCT_NAME: Crowser
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Crowser/Info.plist
      properties:
        CFBundleDisplayName: Crowser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Soot
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Websites you visit can ask to use the camera, for example for video calls or scanning.
        NSMicrophoneUsageDescription: Websites you visit can ask to use the microphone, for example for calls or voice search.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location, for example for maps or local results.
        NSFaceIDUsageDescription: Face ID keeps your private tabs locked until you open them.
        NSPhotoLibraryAddUsageDescription: Lets you save images from web pages to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - mailto
          - tel
schemes:
  Crowser:
    build:
      targets:
        Crowser: all
    run:
      config: Debug
    archive:
      config: Release
