name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Crowser.xcodeproj \
            -scheme Crowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Crowser/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Crowser.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Crowser.app/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -qry Crowser.ipa Payload
          ls -lh Crowser.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Crowser-${{ env.VERSION }}-unsigned-ipa
          path: Crowser.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      # Every push to the default branch (or a v* tag) publishes the .ipa as release v<MARKETING_VERSION>,
      # replacing the file if that release already exists. Bump MARKETING_VERSION in project.yml for a new one.
      # A commit message containing [no release] builds and screenshots without publishing.
      - name: Publish release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch) && !contains(github.event.head_commit.message, '[no release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Crowser ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Unsigned build for SideStore. Download **Crowser.ipa** below, then in SideStore: My Apps → + → pick the file.
          files: Crowser.ipa
          overwrite_files: true

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    needs: ipa
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Crowser.xcodeproj \
            -scheme Crowser \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Capture
        run: scripts/screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/Crowser.app screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
